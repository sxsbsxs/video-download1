name: Android Compose APK

on:
  push:
    branches: [main]
    paths:
      - "clients/android/**"
      - ".github/workflows/android-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify toolchain
        run: |
          java -version
          python3.13 --version
          gradle --version

      - name: Build debug APK
        run: gradle -p clients/android assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s clients/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh clients/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDL-Compose-Android-arm64-debug
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
