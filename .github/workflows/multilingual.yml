name: Application build matrix

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "clients/**"
      - "native/**"
      - "docs/**"
      - "README.md"
      - "Dockerfile"
      - ".github/workflows/multilingual.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "clients/**"
      - "native/**"
      - "docs/**"
      - "README.md"
      - "Dockerfile"
      - ".github/workflows/multilingual.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate embedded yt-dlp bridge
        run: python -m py_compile clients/android/app/src/main/python/videodl_mobile.py
      - name: Validate WebView assets
        run: |
          node --check clients/android/app/src/main/assets/app.js
          test -s clients/android/app/src/main/assets/index.html
          test -s clients/android/app/src/main/assets/styles.css
      - name: Build ARM64 Android APK
        run: gradle -p clients/android assembleDebug
      - name: Report APK file size
        run: python -c "from pathlib import Path; p=Path('clients/android/app/build/outputs/apk/debug/app-debug.apk'); print(f'APK_SIZE_BYTES={p.stat().st_size}'); print(f'APK_SIZE_MIB={p.stat().st_size / 1024 / 1024:.2f}')"
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDL-Android-arm64-debug
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - run: gradle -p clients/java test build

  c:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libcurl4-openssl-dev clang
      - name: Configure C11 SDK
        run: cmake -S native/c-client -B build/c-client -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Debug
      - name: Build C SDK and CLI
        run: cmake --build build/c-client --parallel
      - name: Run C unit tests
        run: ctest --test-dir build/c-client --output-on-failure
      - name: Verify CLI help
        run: ./build/c-client/videodl-c --help

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev nlohmann-json3-dev
      - run: cmake -S clients/cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cpp --config Release

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: clients/rust
        run: cargo test
      - working-directory: native/rust-core
        run: cargo test

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple SwiftUI app
        run: swift build --package-path clients/apple

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Avalonia desktop app
        run: dotnet build clients/desktop/VideoDL.Desktop.csproj --configuration Release
