<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="VideoDL - 简洁快速的在线视频解析与下载工具">
  <title>VideoDL · 视频下载器</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="VideoDL 首页"><span class="brand-mark">V</span><span>VideoDL</span></a>
      <span class="engine-status"><i></i> yt-dlp 引擎就绪</span>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">VIDEO DOWNLOADER <span>·</span> 简单、高效</div>
        <h1>把视频，<em>带走。</em></h1>
        <p class="subtitle">粘贴视频链接，解析可用画质，然后下载到你的设备。</p>

        <form id="parse-form" class="url-card">
          <div class="url-input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3A5 5 0 0 0 13 2.93l-1.72 1.71M14 11a5 5 0 0 0-7.07 0l-3 3A5 5 0 0 0 11 21.07l1.71-1.72"/></svg>
            <input id="video-url" type="url" placeholder="粘贴视频链接，例如 https://..." autocomplete="url" required>
            <button type="button" id="paste-btn" class="paste-btn">粘贴</button>
          </div>
          <button class="primary-btn" id="parse-btn" type="submit"><span>解析视频</span><b>↗</b></button>
        </form>

        <div class="hint-row"><span>支持公开可访问的视频链接</span><span>无需注册 · 无需安装</span></div>
      </section>

      <section id="loading" class="loading-panel hidden" aria-live="polite">
        <div class="spinner"></div><span>正在解析视频信息…</span>
      </section>

      <section id="error" class="error-panel hidden" role="alert"></section>

      <section id="result" class="result-card hidden">
        <div class="result-heading"><span class="section-kicker">VIDEO FOUND</span><span class="ready-pill"><i></i> 已解析</span></div>
        <div class="video-detail">
          <div class="thumb-wrap"><img id="thumbnail" alt="视频封面"><span id="duration" class="duration"></span></div>
          <div class="video-copy"><h2 id="video-title"></h2><p id="uploader"></p></div>
        </div>
        <div class="download-row">
          <label for="quality">下载画质</label>
          <select id="quality"></select>
          <button id="download-btn" class="download-btn"><span>下载视频</span><b>↓</b></button>
        </div>
        <p class="result-note">下载由服务器临时处理，完成传输后会清理临时文件。</p>
      </section>

      <section class="features">
        <div class="feature"><span class="feature-icon">01</span><div><strong>粘贴链接</strong><p>输入公开视频地址</p></div></div>
        <div class="feature"><span class="feature-icon">02</span><div><strong>选择画质</strong><p>自动识别可用清晰度</p></div></div>
        <div class="feature"><span class="feature-icon">03</span><div><strong>直接下载</strong><p>保存到手机或电脑</p></div></div>
      </section>
    </main>

    <footer><span>© 2026 VideoDL</span><span>请尊重版权与网站服务条款</span></footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
