services:
  - type: web
    name: videodl
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MAX_DURATION_SECONDS
        value: "7200"
      - key: MAX_FILE_MB
        value: "1024"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
